<!doctype html>
<!--
  motion-lab example: a 6 s seamless loop, 60 fps (360 frames, rendered 0..359).
  Every frame is a pure function of t: no clock, no timers, no unseeded randomness, no network.
  Render:  python3 ~/aios/hooks/motion-render.py frames loop-6s.html --out frames --all --size 1080x1080
  Check:   python3 ~/aios/hooks/motion-check.py contract loop-6s.html   (then seam / pops / determinism)
-->
<html lang="en">
<head>
<meta charset="utf-8">
<title>motion-lab · 6 s loop</title>
<style>
  html, body { margin: 0; height: 100%; background: #0e0f12; overflow: hidden; }
  canvas { display: block; width: 100vw; height: 100vh; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
  // ── timing: everything hangs off the frame count ──────────────────────────────
  window.__duration = 6;          // seconds
  window.__fps = 60;
  const BEATS = 12;               // 120 BPM over 6 s: one beat = 30 frames

  // ── numbers sheet (references/numbers.md) ────────────────────────────────────
  const TAU = Math.PI * 2;
  // Closed-form underdamped spring, x(0)=0 -> 1, damping ratio zeta, natural freq w (rad/s).
  // A function of t, not a simulation, so any frame renders on its own.
  function spring(t, zeta = 0.7, w = 14) {
    if (t <= 0) return 0;
    const wd = w * Math.sqrt(1 - zeta * zeta);
    return 1 - Math.exp(-zeta * w * t) * (Math.cos(wd * t) + (zeta * w / wd) * Math.sin(wd * t));
  }
  // Seeded PRNG (mulberry32): the same seed gives the same "random" layout on every render.
  function mulberry32(a) { return function () { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
  const rnd = mulberry32(7);
  const DOTS = Array.from({ length: 9 }, (_, i) => ({ ring: 0.22 + 0.06 * (i % 3), phase: rnd() * TAU, hue: 18 + rnd() * 14 }));

  const cv = document.getElementById('c'), cx = cv.getContext('2d');
  function size() { cv.width = innerWidth; cv.height = innerHeight; }
  size();

  // State the checks can read: motion-check `assert` and motion-render `speed` use __probe(t).
  function state(t) {
    const D = window.__duration, phase = (t % D) / D;            // whole cycles: frame N == frame 0
    const beat = (phase * BEATS) % 1, beatT = beat * (D / BEATS);  // seconds since the last beat
    const pulse = 1 + 0.08 * (spring(beatT, 0.5, 22) - spring(beatT - 0.18, 0.7, 14));  // 1 -> 1.08 -> 1
    return { phase, pulse, spin: phase * TAU };
  }
  window.__probe = (t) => { const s = state(t); return { phase: s.phase, pulse: s.pulse, spin: s.spin }; };

  window.renderAt = (t) => {
    const s = state(t), W = cv.width, H = cv.height, m = Math.min(W, H);
    cx.fillStyle = '#0e0f12'; cx.fillRect(0, 0, W, H);
    cx.save(); cx.translate(W / 2, H / 2);
    // one hero move: the ring breathes on the beat
    cx.strokeStyle = 'rgba(255,93,77,0.9)'; cx.lineWidth = m * 0.006;
    cx.beginPath(); cx.arc(0, 0, m * 0.16 * s.pulse, 0, TAU); cx.stroke();
    // secondary moves: orbit at 50-70% of the hero's travel, later in phase
    DOTS.forEach((d, i) => {
      const a = d.phase + s.spin * (i % 2 ? -1 : 1);   // whole turns per cycle, or the seam jumps
      const r = m * d.ring * (1 + 0.6 * (s.pulse - 1));
      cx.fillStyle = `hsl(${d.hue}, 90%, 62%)`;
      cx.beginPath(); cx.arc(Math.cos(a) * r, Math.sin(a) * r, m * 0.012, 0, TAU); cx.fill();
    });
    cx.restore();
  };
  window.__ready = true;
  window.renderAt(Number(new URLSearchParams(location.search).get('t')) || 0);  // ?t= freezes any frame
</script>
</body>
</html>
